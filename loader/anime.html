<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กำลังโหลด</title>
<style>html,body{background:transparent!important}</style></head><body><div id="app"></div>
<!-- หน้าโหลด กลุ่มบริหารงบประมาณ · ธีมอนิเมะ (ไฟล์นี้ไม่ต้องแก้) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Kanit:wght@500;600&family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  /* ===== โฮโลแกรมฟ้าเรืองแสง + ทอง + ม่วงโรงเรียน ===== */
  :root{ --bg:#01040f; --holo:#67e8f9; --holo-d:#0e7490; --teal:#2dd4bf; --violet:#a78bfa; --gold:#fcd34d; --ink:#ecfeff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Sarabun",sans-serif;background:#f7f6fd;color:#1e1b4b;overflow-x:hidden}

  /* ================= LOADER ================= */
  #loader{--e:min(40vw,180px,21vh);position:fixed;inset:0;z-index:9999;overflow:hidden;color:var(--ink);
    background:radial-gradient(ellipse 90% 70% at 50% 40%,#13204f 0%,#080f2e 45%,var(--bg) 100%)}
  .hl-aurora{position:absolute;left:-20%;right:-20%;top:-10%;height:65%;pointer-events:none;opacity:.6;will-change:transform;
    background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(56,189,248,.18),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(167,139,250,.22),transparent 70%)}
  #space{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hl-island{position:absolute;left:50%;top:40%;width:min(70vw,520px);margin-left:calc(min(70vw,520px)/-2);opacity:0;will-change:transform,opacity;pointer-events:none}
  .hl-island svg{width:100%;height:auto;display:block}
  .hl-scan{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,rgba(103,232,249,.25) 0 1px,transparent 1px 4px)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .hl-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:2}
  .hl-center > *{flex:none}
  @media (min-width:700px){ .hl-load{zoom:1.32} .hl-group{zoom:1.18} .hl-eyebrow{zoom:1.25} }
  .hl-stage{position:relative;width:var(--e);height:var(--e);margin:calc(var(--e)*.58) 0 calc(var(--e)*.66);perspective:900px}
  .hl-stage > *{position:absolute;left:50%;top:50%}
  .hl-light{width:calc(var(--e)*3);height:calc(var(--e)*3);border-radius:50%;opacity:0;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(221,214,254,.6) 18%,rgba(167,139,250,.3) 34%,rgba(125,211,252,.12) 48%,transparent 66%)}
  .hl-ring{width:calc(var(--e)*2.15);height:calc(var(--e)*2.15);opacity:0;will-change:transform,opacity}
  .hl-ring svg{width:100%;height:100%;overflow:visible;display:block}

  /* เหรียญตราโรงเรียน */
  .hl-coin{width:calc(var(--e)*1.16);height:calc(var(--e)*1.16);border-radius:50%;opacity:0;will-change:transform,opacity}
  .hl-face{position:absolute;inset:6%;border-radius:50%;display:grid;place-items:center;will-change:transform;
    background:radial-gradient(circle at 42% 38%,#ffffff 0%,#f8fbff 55%,#e6f7ff 100%);
    box-shadow:0 0 0 2px rgba(236,254,255,.95),0 0 0 calc(var(--e)*.045) rgba(103,232,249,.22),0 0 34px rgba(103,232,249,.85),0 0 80px rgba(167,139,250,.6),0 0 140px rgba(103,232,249,.25)}
  .hl-sigil{width:calc(var(--e)*1.62);height:calc(var(--e)*1.62);opacity:0;will-change:transform,opacity}
  .hl-sigil .mc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform}
  .hl-mote{width:calc(var(--e)*1.4);height:calc(var(--e)*1.4);opacity:0;will-change:transform,opacity}
  .hl-mote i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ecfeff;box-shadow:0 0 8px 2px rgba(103,232,249,.9)}
  .hl-face img{width:78%;height:78%;object-fit:contain}

  /* ประตูโฮโลแกรม */
  .hl-door{width:calc(var(--e)*1.9);height:calc(var(--e)*1.9);will-change:transform,opacity,clip-path}
  .hl-door .seal{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform,opacity}
  .hl-core{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(224,242,254,.65) 22%,rgba(167,139,250,.35) 48%,transparent 70%)}
  .hl-keyline{position:absolute;left:50%;top:-4%;width:3px;height:56%;margin-left:-1.5px;border-radius:3px;opacity:0;transform-origin:50% 0;
    background:linear-gradient(180deg,#fff7d6,#fcd34d 40%,rgba(252,211,77,0));box-shadow:0 0 14px rgba(252,211,77,.9)}
  .hl-beam{position:absolute;left:-15%;right:-15%;height:2px;top:0;opacity:0;pointer-events:none;
    background:linear-gradient(90deg,transparent,#67e8f9 20%,#ecfeff 50%,#67e8f9 80%,transparent);box-shadow:0 0 16px 3px rgba(103,232,249,.7)}

  /* แผงข้อมูลโฮโลแกรม (จอกว้าง) */
  .hl-panel{position:absolute;top:50%;width:min(23vw,260px);padding:14px 16px;border:1px solid rgba(103,232,249,.45);border-radius:6px;opacity:0;
    background:linear-gradient(180deg,rgba(14,116,144,.22),rgba(8,47,73,.12));box-shadow:inset 0 0 22px rgba(103,232,249,.12);
    font-family:"Rajdhani",sans-serif;text-align:left;color:rgba(236,254,255,.85);will-change:transform,opacity}
  .hl-panel.l{right:calc(50% + var(--e)*1.35)} .hl-panel.r{left:calc(50% + var(--e)*1.35)}
  .hl-panel h4{font-weight:600;font-size:12px;letter-spacing:.25em;color:var(--holo);margin-bottom:8px;display:flex;justify-content:space-between}
  .hl-panel svg{width:100%;height:50px;display:block;margin-bottom:8px}
  .hl-panel .rw{display:flex;align-items:center;gap:8px;font-family:"Sarabun",sans-serif;font-size:12px;margin-top:6px}
  .hl-panel .rw span{width:56px;color:rgba(236,254,255,.7)}
  .hl-panel .rw i{flex:1;height:3px;background:rgba(103,232,249,.15);position:relative;overflow:hidden}
  .hl-panel .rw i b{position:absolute;inset:0;background:linear-gradient(90deg,var(--holo),var(--violet));transform-origin:left;transform:scaleX(0)}
  .hl-panel .corner{position:absolute;width:10px;height:10px;border:2px solid var(--holo)}
  .hl-panel .c1{left:-2px;top:-2px;border-right:0;border-bottom:0} .hl-panel .c2{right:-2px;bottom:-2px;border-left:0;border-top:0}
  @media (max-width:820px){.hl-panel{display:none}}
  @media (max-width:520px){.hl-eyebrow .tr{display:none}}

  .hl-eyebrow{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:clamp(10px,2.8vw,13px);letter-spacing:.45em;padding-left:.45em;color:var(--holo)}
  .hl-title{font-family:"Noto Serif Thai",serif;line-height:1.3;margin-top:6px;isolation:isolate}
  .hl-title .l1{display:block;font-size:clamp(15px,4.2vw,22px);font-weight:500;letter-spacing:.25em;color:rgba(236,254,255,.75)}
  .hl-title .wrap{position:relative;display:inline-block;white-space:nowrap}
  .hl-title .l2{display:block;white-space:nowrap;font-size:clamp(18px,5.6vw,60px);font-weight:700;padding:.05em .2em .15em;
    background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%),linear-gradient(180deg,#ffffff 25%,#cffafe 60%,#fde68a 100%);
    background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent}
  .hl-title .l2.sheen{animation:sheen 4.5s cubic-bezier(.5,0,.3,1) infinite}
  @keyframes sheen{0%{background-position:160% 0,0 0}45%,100%{background-position:-60% 0,0 0}}
  .hl-title .l2.glow{position:absolute;inset:0;z-index:-1;background:none;color:transparent;animation:none;text-shadow:0 0 18px rgba(103,232,249,.7),0 0 46px rgba(252,211,77,.3)}
  /* ชื่อกลุ่มงาน: แคปซูลกระจก ขอบแสงหมุน (โมเดิร์น) */
  .hl-group{display:flex;justify-content:center;margin-top:clamp(12px,2.2vh,20px)}
  .hl-group .cap{position:relative;isolation:isolate;overflow:hidden;border-radius:999px;padding:10px clamp(26px,7vw,46px) 12px;
    box-shadow:0 0 30px rgba(139,92,246,.45),0 0 60px rgba(56,189,248,.2)}
  .hl-group .cap::before{content:"";position:absolute;left:50%;top:50%;width:200%;aspect-ratio:1;z-index:-2;transform:translate(-50%,-50%);will-change:transform;
    background:conic-gradient(from 0deg,#38bdf8,#a78bfa,#f0abfc,#fcd34d,#38bdf8 50%,#a78bfa,#f0abfc,#fcd34d,#38bdf8);animation:spinb 4s linear infinite}
  .hl-group .cap::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:999px;
    background:linear-gradient(180deg,rgba(30,27,90,.96),rgba(8,12,40,.96))}
  @keyframes spinb{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .hl-group .g{display:block;white-space:nowrap;font-family:"Kanit",sans-serif;font-weight:600;font-size:clamp(21px,6vw,38px);letter-spacing:.06em;line-height:1.3}
  .hl-group .g.main{background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),linear-gradient(90deg,#7dd3fc 0%,#e0e7ff 35%,#ffffff 50%,#e9d5ff 65%,#fcd34d 100%);
    background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gsheen 3.4s cubic-bezier(.5,0,.3,1) infinite 1s}
  .hl-group .g.glow{position:absolute;left:0;right:0;top:10px;color:transparent;text-shadow:0 0 16px rgba(167,139,250,.9),0 0 34px rgba(56,189,248,.45)}
  @keyframes gsheen{0%{background-position:160% 0,0 0}50%,100%{background-position:-60% 0,0 0}}

  .hl-load{width:min(86vw,max(390px,calc(var(--e)*2.4)));margin-top:clamp(14px,3vh,26px);padding:14px 16px 12px;border-radius:18px;font-family:"Rajdhani",sans-serif;
    background:rgba(4,18,40,.82);border:1px solid rgba(252,211,77,.32);box-shadow:0 10px 34px rgba(0,0,0,.35),inset 0 0 20px rgba(103,232,249,.06)}
  .hl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .hl-status{font-family:"Sarabun",sans-serif;font-size:clamp(13px,3.5vw,15px);color:rgba(236,254,255,.75)}
  .hl-pct{font-weight:700;font-size:clamp(26px,7.4vw,36px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(252,211,77,.7)}
  .hl-bar{position:relative;height:12px;border-radius:12px;background:rgba(10,14,40,.9);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(252,211,77,.4),inset 0 2px 4px rgba(0,0,0,.4)}
  .hl-bar i{position:absolute;inset:0;border-radius:12px;transform-origin:left;transform:scaleX(0);overflow:hidden;
    background:linear-gradient(180deg,#fffbe6 0%,#fde68a 22%,#fcd34d 45%,#f5b70a 70%,#c98d06 100%);
    box-shadow:0 0 10px rgba(252,211,77,.85),0 0 24px rgba(252,211,77,.45),inset 0 -2px 3px rgba(150,95,0,.35)}
  .hl-bar i::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:goldshine 1.6s ease-in-out infinite}
  .hl-bar i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9),rgba(255,255,255,.2))}
  @keyframes goldshine{0%{left:-40%}100%{left:110%}}
  .hl-cols{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px}
  .hl-col{display:flex;flex-direction:column;align-items:center;gap:5px}
  .hl-col svg{width:34px;height:34px;overflow:visible;opacity:.4;transition:opacity .4s}
  .hl-col svg .ln{fill:none;stroke:#fcd34d;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .hl-col svg .fl{fill:rgba(252,211,77,0);transition:fill .4s}
  .hl-col span{font-family:"Sarabun",sans-serif;font-size:clamp(13px,3.5vw,15px);color:rgba(236,254,255,.4);transition:color .4s}
  .hl-col.lit svg{opacity:1;animation:pop .6s cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 0 6px rgba(252,211,77,.8))}
  .hl-col.lit svg .fl{fill:rgba(252,211,77,.28)}
  .hl-col.lit span{color:#fff}
  @keyframes pop{0%{transform:scale(1.4)}100%{transform:scale(1)}}

  .hl-bloom{position:absolute;left:50%;top:0;width:160vmax;height:160vmax;margin-left:-80vmax;border-radius:50%;opacity:0;pointer-events:none;z-index:6;will-change:transform,opacity;
    background:radial-gradient(circle,#ffffff 0%,rgba(237,233,254,.94) 16%,rgba(196,181,253,.5) 30%,rgba(125,211,252,.2) 44%,transparent 62%)}

  /* ================= ตัวอย่างหน้าระบบ ================= */
  #app{min-height:100vh}

  /* ================= 8 ธีม ================= */
  #loader .hl-sigil,#loader .hl-ring,#loader .hl-door,#loader .hl-mote,#loader .hl-panel{filter:var(--hue,none)}
  #loader .hl-scan{display:none} #loader.th-scifi .hl-scan{display:block}
  .sc{position:absolute;inset:0;pointer-events:none;overflow:hidden} #amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #loader .hl-load{background:rgba(8,6,30,.82)}
  .sc .castle{left:50%;width:100vw;transform:translateX(-50%)} .sc .castle.r{display:none} @media (min-width:821px){.sc .castle{left:1%;width:min(40vw,540px);transform:none} .sc .castle.r{display:block;left:auto;right:1%;width:min(30vw,400px);transform:scaleX(-1)}}
  #loader.th-castleN{background:linear-gradient(180deg,#0b0a35 0%,#221a63 50%,#5a3c8f 85%,#8a5aa8 100%);--hue:sepia(.85) saturate(2.2) hue-rotate(-18deg) brightness(1.2)}
  #loader.th-castleN .hl-aurora{background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(252,211,77,.18),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(244,114,182,.18),transparent 70%)}
  #loader.th-castleN .hl-light{background:radial-gradient(circle,rgb(255,251,235) 0%,rgba(253,230,138,.6) 18%,rgba(244,114,182,.28) 36%,transparent 64%)}
  #loader.th-castleN .hl-bloom{background:radial-gradient(circle,#fff 0%,rgba(255,251,235,.95) 16%,rgba(253,230,138,.5) 30%,rgba(244,114,182,.2) 44%,transparent 62%)}
  #loader.th-castleN .hl-face{box-shadow:0 0 0 2px #fff,0 0 0 calc(var(--e)*.045) rgba(252,211,77,.28),0 0 34px rgba(252,211,77,.85),0 0 80px rgba(244,114,182,.6),0 0 140px rgba(252,211,77,.25)}
  #loader.th-castleN .hl-eyebrow{color:#fef3c7;text-shadow:0 0 10px rgba(120,53,15,.6)}
  #loader.th-castleN .hl-title .l2.main{background-image:linear-gradient(100deg,transparent 38%,#fff 50%,transparent 62%),linear-gradient(180deg,#ffffff 25%,#fff7ed 58%,#fcd34d 100%)}
  #loader.th-castleN .hl-title .l2.glow{text-shadow:0 0 18px rgba(120,53,15,.85),0 0 46px rgba(251,146,60,.45)}
  #loader.th-castleN .hl-pct{color:#fde68a;text-shadow:0 0 10px #fde68a}
  #loader.th-castleN .hl-col svg .ln{stroke:#fde68a} #loader.th-castleN .hl-col.lit svg{filter:drop-shadow(0 0 6px #fde68a)}
  #loader.th-castleN .hl-panel{display:none}
  #loader.th-castleN .hl-group .cap::before{display:none} #loader.th-castleN .hl-group .g.main{background:none;-webkit-text-fill-color:#fff;color:#fff;animation:none}
  #loader.th-castleN .hl-group .cap{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6),0 0 40px rgba(252,211,77,.35)}
  #loader.th-castleN .hl-group .cap::after{inset:0;width:28%;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:capsweep 3.2s ease-in-out infinite}
  #loader.th-castleN .hl-group .g.glow{text-shadow:0 0 14px rgba(252,211,77,.9)}
  @keyframes capsweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(420%)}} @keyframes capflow{to{background-position:200% 0}}

  /* ===== ธีมคริสต์มาส ===== */
  #loader.th-xmas{background:linear-gradient(180deg,#090b2e 0%,#17154a 45%,#2c2266 80%,#3d2c74 100%)}
  #loader.th-xmas .hl-face{box-shadow:0 0 0 2px #fff,0 0 0 calc(var(--e)*.045) rgba(252,211,77,.28),0 0 34px rgba(252,211,77,.85),0 0 80px rgba(239,68,68,.45),0 0 140px rgba(252,211,77,.25)}
  #loader.th-xmas .hl-aurora{background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(252,211,77,.12),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(239,68,68,.12),transparent 70%)}
  #loader.th-xmas .hl-light{background:radial-gradient(circle,#fffdf2 0%,rgba(254,243,199,.7) 18%,rgba(252,211,77,.32) 34%,rgba(239,68,68,.12) 48%,transparent 66%)}
  #loader.th-xmas .hl-bloom{background:radial-gradient(circle,#fffdf5 0%,rgba(254,243,199,.94) 16%,rgba(252,211,77,.5) 30%,rgba(239,68,68,.16) 44%,transparent 62%)}
  .sc .xm-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 100%,rgba(252,211,77,.18),transparent 70%)}
  .sc .xm-bokeh i{position:absolute;border-radius:50%;filter:blur(2px)}
  .sc .xm-lightstr{position:absolute;left:0;top:0;width:100%;height:min(12vh,96px)}
  .sc .xm-bulb{position:absolute;width:9px;height:13px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);
    box-shadow:0 0 8px 2px var(--c),0 0 20px 4px var(--c);animation:bulb 2s ease-in-out infinite}
  @keyframes bulb{50%{opacity:.45;box-shadow:0 0 4px 1px var(--c)}}
  .sc .xm-tree{position:absolute;bottom:min(3vh,26px)}
  .sc .xm-tree .lt{animation:tw 1.8s ease-in-out infinite} .sc .xm-tree .l1{animation-delay:-.6s} .sc .xm-tree .l2{animation-delay:-1.2s}
  .sc .xm-tree .fl{animation:tw 1.2s ease-in-out infinite}
  @keyframes tw{50%{opacity:.35}}
  .sc .xm-tree circle.lt{filter:drop-shadow(0 0 3px #fde68a)}
  .sc .xm-tree.l{left:-6vw;width:min(46vw,300px)} .sc .xm-tree.r{right:-6vw;width:min(36vw,230px)}
  @media (min-width:821px){ .sc .xm-tree.l{left:3%;width:min(30vw,420px)} .sc .xm-tree.r{right:3%;width:min(22vw,300px)} }


  /* ต้นคริสต์มาสภาพจริง */
  .sc .xm-tree{aspect-ratio:446/1000;width:auto}
  .sc .xm-tree img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(252,211,77,.28)) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  .sc .xm-tree i{position:absolute;width:calc(10px*var(--s));height:calc(10px*var(--s));margin:-5px 0 0 -5px;border-radius:50%;
    background:radial-gradient(circle,#fffbe6 0%,rgba(253,230,138,.9) 30%,rgba(252,211,77,0) 70%);animation:spark 2.4s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.4)}}
  .sc .xm-tree .star-glow{position:absolute;left:43%;top:9%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,247,214,.85) 0%,rgba(252,211,77,.35) 30%,transparent 65%);animation:sglow 2.2s ease-in-out infinite}
  @keyframes sglow{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.15)}}
  .sc .xm-tree.l{left:-4vw;height:min(46vh,420px)} .sc .xm-tree.r{right:-4vw;height:min(36vh,330px)}
  @media (min-width:821px){ .sc .xm-tree.l{left:4%;height:min(74vh,720px)} .sc .xm-tree.r{right:4%;height:min(58vh,560px)} }

     ถ้าต้องการรอดึงข้อมูลจากเซิร์ฟเวอร์ก่อน ให้ลบ 2 บรรทัดล่าง แล้วเรียก SchoolLoader.ready() ใน withSuccessHandler แทน */
  if (document.readyState === 'complete') SchoolLoader.ready();
  else window.addEventListener('load', () => SchoolLoader.ready());
})();
</script>

<script>
/* ตัวห่อ (ไม่แตะเนื้อหาธีมเดิม): แจ้งหน้าหลักเมื่อหน้าโหลดจบ */
(function(){var t=setInterval(function(){if(!document.getElementById('loader')){clearInterval(t);try{parent.postMessage('sbl-done','*')}catch(e){}}},120);})();
</script></body></html>
