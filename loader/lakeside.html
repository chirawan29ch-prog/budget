<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กำลังโหลด</title>
<style>html,body{background:transparent!important}</style>
<script>
/* ตัวห่อ: ไม่แก้ไฟล์ธีมเดิม · พักไทม์ไลน์ของ gsap ไว้จนกว่าไฟล์/ฟอนต์/รูปจะโหลดครบ (window load) แล้วค่อยเล่น เพื่อให้แอนิเมชันเริ่มพร้อมตอนเปิดให้เห็น ไม่เล่นไปก่อนตอนโหลดช้า */
(function(){var g;try{Object.defineProperty(window,'gsap',{configurable:true,get:function(){return g},set:function(v){g=v;try{v.globalTimeline.pause()}catch(e){}}})}catch(e){}
function go(){setTimeout(function(){try{g.globalTimeline.resume()}catch(e){}},60)}
if(document.readyState==='complete')go();else addEventListener('load',go)})();
</script></head><body><div id="app"></div>
<!-- หน้าโหลด กลุ่มบริหารงบประมาณ · ธีมหมู่บ้านริมทะเลสาบ (ไฟล์นี้ไม่ต้องแก้) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Kanit:wght@500;600&family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  /* ===== โฮโลแกรมฟ้าเรืองแสง + ทอง + ม่วงโรงเรียน ===== */
  :root{ --bg:#01040f; --holo:#67e8f9; --holo-d:#0e7490; --teal:#2dd4bf; --violet:#a78bfa; --gold:#fcd34d; --ink:#ecfeff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Sarabun",sans-serif;background:#f7f6fd;color:#1e1b4b;overflow-x:hidden}

  /* ================= LOADER ================= */
  #loader{--e:min(40vw,180px,21vh);position:fixed;inset:0;z-index:9999;overflow:hidden;color:var(--ink);
    background:radial-gradient(ellipse 90% 70% at 50% 40%,#13204f 0%,#080f2e 45%,var(--bg) 100%)}
  .hl-aurora{position:absolute;left:-20%;right:-20%;top:-10%;height:65%;pointer-events:none;opacity:.6;will-change:transform;
    background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(56,189,248,.18),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(167,139,250,.22),transparent 70%)}
  #space{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hl-island{position:absolute;left:50%;top:40%;width:min(70vw,520px);margin-left:calc(min(70vw,520px)/-2);opacity:0;will-change:transform,opacity;pointer-events:none}
  .hl-island svg{width:100%;height:auto;display:block}
  .hl-scan{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,rgba(103,232,249,.25) 0 1px,transparent 1px 4px)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .hl-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:2}
  .hl-center > *{flex:none}
  @media (min-width:700px){ .hl-load{zoom:1.32} .hl-group{zoom:1.18} .hl-eyebrow{zoom:1.25} }
  .hl-stage{position:relative;width:var(--e);height:var(--e);margin:calc(var(--e)*.58) 0 calc(var(--e)*.66);perspective:900px}
  .hl-stage > *{position:absolute;left:50%;top:50%}
  .hl-light{width:calc(var(--e)*3);height:calc(var(--e)*3);border-radius:50%;opacity:0;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(221,214,254,.6) 18%,rgba(167,139,250,.3) 34%,rgba(125,211,252,.12) 48%,transparent 66%)}
  .hl-ring{width:calc(var(--e)*2.15);height:calc(var(--e)*2.15);opacity:0;will-change:transform,opacity}
  .hl-ring svg{width:100%;height:100%;overflow:visible;display:block}

  /* เหรียญตราโรงเรียน */
  .hl-coin{width:calc(var(--e)*1.16);height:calc(var(--e)*1.16);border-radius:50%;opacity:0;will-change:transform,opacity}
  .hl-face{position:absolute;inset:6%;border-radius:50%;display:grid;place-items:center;will-change:transform;
    background:radial-gradient(circle at 42% 38%,#ffffff 0%,#f8fbff 55%,#e6f7ff 100%);
    box-shadow:0 0 0 2px rgba(236,254,255,.95),0 0 0 calc(var(--e)*.045) rgba(103,232,249,.22),0 0 34px rgba(103,232,249,.85),0 0 80px rgba(167,139,250,.6),0 0 140px rgba(103,232,249,.25)}
  .hl-sigil{width:calc(var(--e)*1.62);height:calc(var(--e)*1.62);opacity:0;will-change:transform,opacity}
  .hl-sigil .mc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform}
  .hl-mote{width:calc(var(--e)*1.4);height:calc(var(--e)*1.4);opacity:0;will-change:transform,opacity}
  .hl-mote i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ecfeff;box-shadow:0 0 8px 2px rgba(103,232,249,.9)}
  .hl-face img{width:78%;height:78%;object-fit:contain}

  /* ประตูโฮโลแกรม */
  .hl-door{width:calc(var(--e)*1.9);height:calc(var(--e)*1.9);will-change:transform,opacity,clip-path}
  .hl-door .seal{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform,opacity}
  .hl-core{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(224,242,254,.65) 22%,rgba(167,139,250,.35) 48%,transparent 70%)}
  .hl-keyline{position:absolute;left:50%;top:-4%;width:3px;height:56%;margin-left:-1.5px;border-radius:3px;opacity:0;transform-origin:50% 0;
    background:linear-gradient(180deg,#fff7d6,#fcd34d 40%,rgba(252,211,77,0));box-shadow:0 0 14px rgba(252,211,77,.9)}
  .hl-beam{position:absolute;left:-15%;right:-15%;height:2px;top:0;opacity:0;pointer-events:none;
    background:linear-gradient(90deg,transparent,#67e8f9 20%,#ecfeff 50%,#67e8f9 80%,transparent);box-shadow:0 0 16px 3px rgba(103,232,249,.7)}

  /* แผงข้อมูลโฮโลแกรม (จอกว้าง) */
  .hl-panel{position:absolute;top:50%;width:min(23vw,260px);padding:14px 16px;border:1px solid rgba(103,232,249,.45);border-radius:6px;opacity:0;
    background:linear-gradient(180deg,rgba(14,116,144,.22),rgba(8,47,73,.12));box-shadow:inset 0 0 22px rgba(103,232,249,.12);
    font-family:"Rajdhani",sans-serif;text-align:left;color:rgba(236,254,255,.85);will-change:transform,opacity}
  .hl-panel.l{right:calc(50% + var(--e)*1.35)} .hl-panel.r{left:calc(50% + var(--e)*1.35)}
  .hl-panel h4{font-weight:600;font-size:12px;letter-spacing:.25em;color:var(--holo);margin-bottom:8px;display:flex;justify-content:space-between}
  .hl-panel svg{width:100%;height:50px;display:block;margin-bottom:8px}
  .hl-panel .rw{display:flex;align-items:center;gap:8px;font-family:"Sarabun",sans-serif;font-size:12px;margin-top:6px}
  .hl-panel .rw span{width:56px;color:rgba(236,254,255,.7)}
  .hl-panel .rw i{flex:1;height:3px;background:rgba(103,232,249,.15);position:relative;overflow:hidden}
  .hl-panel .rw i b{position:absolute;inset:0;background:linear-gradient(90deg,var(--holo),var(--violet));transform-origin:left;transform:scaleX(0)}
  .hl-panel .corner{position:absolute;width:10px;height:10px;border:2px solid var(--holo)}
  .hl-panel .c1{left:-2px;top:-2px;border-right:0;border-bottom:0} .hl-panel .c2{right:-2px;bottom:-2px;border-left:0;border-top:0}
  @media (max-width:820px){.hl-panel{display:none}}
  @media (max-width:520px){.hl-eyebrow .tr{display:none}}

  .hl-eyebrow{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:clamp(10px,2.8vw,13px);letter-spacing:.45em;padding-left:.45em;color:var(--holo)}
  .hl-title{font-family:"Noto Serif Thai",serif;line-height:1.3;margin-top:6px;isolation:isolate}
  .hl-title .l1{display:block;font-size:clamp(15px,4.2vw,22px);font-weight:500;letter-spacing:.25em;color:rgba(236,254,255,.75)}
  .hl-title .wrap{position:relative;display:inline-block;white-space:nowrap}
  .hl-title .l2{display:block;white-space:nowrap;font-size:clamp(18px,5.6vw,60px);font-weight:700;padding:.05em .2em .15em;
    background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%),linear-gradient(180deg,#ffffff 25%,#cffafe 60%,#fde68a 100%);
    background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent}
  .hl-title .l2.sheen{animation:sheen 4.5s cubic-bezier(.5,0,.3,1) infinite}
  @keyframes sheen{0%{background-position:160% 0,0 0}45%,100%{background-position:-60% 0,0 0}}
  .hl-title .l2.glow{position:absolute;inset:0;z-index:-1;background:none;color:transparent;animation:none;text-shadow:0 0 18px rgba(103,232,249,.7),0 0 46px rgba(252,211,77,.3)}
  /* ชื่อกลุ่มงาน: แคปซูลกระจก ขอบแสงหมุน (โมเดิร์น) */
  .hl-group{display:flex;justify-content:center;margin-top:clamp(12px,2.2vh,20px)}
  .hl-group .cap{position:relative;isolation:isolate;overflow:hidden;border-radius:999px;padding:10px clamp(26px,7vw,46px) 12px;
    box-shadow:0 0 30px rgba(139,92,246,.45),0 0 60px rgba(56,189,248,.2)}
  .hl-group .cap::before{content:"";position:absolute;left:50%;top:50%;width:200%;aspect-ratio:1;z-index:-2;transform:translate(-50%,-50%);will-change:transform;
    background:conic-gradient(from 0deg,#38bdf8,#a78bfa,#f0abfc,#fcd34d,#38bdf8 50%,#a78bfa,#f0abfc,#fcd34d,#38bdf8);animation:spinb 4s linear infinite}
  .hl-group .cap::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:999px;
    background:linear-gradient(180deg,rgba(30,27,90,.96),rgba(8,12,40,.96))}
  @keyframes spinb{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .hl-group .g{display:block;white-space:nowrap;font-family:"Kanit",sans-serif;font-weight:600;font-size:clamp(21px,6vw,38px);letter-spacing:.06em;line-height:1.3}
  .hl-group .g.main{background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),linear-gradient(90deg,#7dd3fc 0%,#e0e7ff 35%,#ffffff 50%,#e9d5ff 65%,#fcd34d 100%);
    background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gsheen 3.4s cubic-bezier(.5,0,.3,1) infinite 1s}
  .hl-group .g.glow{position:absolute;left:0;right:0;top:10px;color:transparent;text-shadow:0 0 16px rgba(167,139,250,.9),0 0 34px rgba(56,189,248,.45)}
  @keyframes gsheen{0%{background-position:160% 0,0 0}50%,100%{background-position:-60% 0,0 0}}

  .hl-load{width:min(86vw,max(390px,calc(var(--e)*2.4)));margin-top:clamp(14px,3vh,26px);padding:14px 16px 12px;border-radius:18px;font-family:"Rajdhani",sans-serif;
    background:rgba(4,18,40,.82);border:1px solid rgba(252,211,77,.32);box-shadow:0 10px 34px rgba(0,0,0,.35),inset 0 0 20px rgba(103,232,249,.06)}
  .hl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .hl-status{font-family:"Sarabun",sans-serif;font-size:clamp(13px,3.5vw,15px);color:rgba(236,254,255,.75)}
  .hl-pct{font-weight:700;font-size:clamp(26px,7.4vw,36px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(252,211,77,.7)}
  .hl-bar{position:relative;height:12px;border-radius:12px;background:rgba(10,14,40,.9);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(252,211,77,.4),inset 0 2px 4px rgba(0,0,0,.4)}
  .hl-bar i{position:absolute;inset:0;border-radius:12px;transform-origin:left;transform:scaleX(0);overflow:hidden;
    background:linear-gradient(180deg,#fffbe6 0%,#fde68a 22%,#fcd34d 45%,#f5b70a 70%,#c98d06 100%);
    box-shadow:0 0 10px rgba(252,211,77,.85),0 0 24px rgba(252,211,77,.45),inset 0 -2px 3px rgba(150,95,0,.35)}
  .hl-bar i::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:goldshine 1.6s ease-in-out infinite}
  .hl-bar i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9),rgba(255,255,255,.2))}
  @keyframes goldshine{0%{left:-40%}100%{left:110%}}
  .hl-cols{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px}
  .hl-col{display:flex;flex-direction:column;align-items:center;gap:5px}
  .hl-col svg{width:34px;height:34px;overflow:visible;opacity:.4;transition:opacity .4s}
  .hl-col svg .ln{fill:none;stroke:#fcd34d;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .hl-col svg .fl{fill:rgba(252,211,77,0);transition:fill .4s}
  .hl-col span{font-family:"Sarabun",sans-serif;font-size:clamp(13px,3.5vw,15px);color:rgba(236,254,255,.4);transition:color .4s}
  .hl-col.lit svg{opacity:1;animation:pop .6s cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 0 6px rgba(252,211,77,.8))}
  .hl-col.lit svg .fl{fill:rgba(252,211,77,.28)}
  .hl-col.lit span{color:#fff}
  @keyframes pop{0%{transform:scale(1.4)}100%{transform:scale(1)}}

  .hl-bloom{position:absolute;left:50%;top:0;width:160vmax;height:160vmax;margin-left:-80vmax;border-radius:50%;opacity:0;pointer-events:none;z-index:6;will-change:transform,opacity;
    background:radial-gradient(circle,#ffffff 0%,rgba(237,233,254,.94) 16%,rgba(196,181,253,.5) 30%,rgba(125,211,252,.2) 44%,transparent 62%)}

  /* ================= ตัวอย่างหน้าระบบ ================= */
  #app{min-height:100vh}

  /* ================= 8 ธีม ================= */
  #loader .hl-sigil,#loader .hl-ring,#loader .hl-door,#loader .hl-mote,#loader .hl-panel{filter:var(--hue,none)}
  #loader .hl-scan{display:none} #loader.th-scifi .hl-scan{display:block}
  .sc{position:absolute;inset:0;pointer-events:none;overflow:hidden} #amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #loader .hl-load{background:rgba(8,6,30,.82)}
  .sc .castle{left:50%;width:100vw;transform:translateX(-50%)} .sc .castle.r{display:none} @media (min-width:821px){.sc .castle{left:1%;width:min(40vw,540px);transform:none} .sc .castle.r{display:block;left:auto;right:1%;width:min(30vw,400px);transform:scaleX(-1)}}
  #loader.th-castleN{background:linear-gradient(180deg,#0b0a35 0%,#221a63 50%,#5a3c8f 85%,#8a5aa8 100%);--hue:sepia(.85) saturate(2.2) hue-rotate(-18deg) brightness(1.2)}
  #loader.th-castleN .hl-aurora{background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(252,211,77,.18),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(244,114,182,.18),transparent 70%)}
  #loader.th-castleN .hl-light{background:radial-gradient(circle,rgb(255,251,235) 0%,rgba(253,230,138,.6) 18%,rgba(244,114,182,.28) 36%,transparent 64%)}
  #loader.th-castleN .hl-bloom{background:radial-gradient(circle,#fff 0%,rgba(255,251,235,.95) 16%,rgba(253,230,138,.5) 30%,rgba(244,114,182,.2) 44%,transparent 62%)}
  #loader.th-castleN .hl-face{box-shadow:0 0 0 2px #fff,0 0 0 calc(var(--e)*.045) rgba(252,211,77,.28),0 0 34px rgba(252,211,77,.85),0 0 80px rgba(244,114,182,.6),0 0 140px rgba(252,211,77,.25)}
  #loader.th-castleN .hl-eyebrow{color:#fef3c7;text-shadow:0 0 10px rgba(120,53,15,.6)}
  #loader.th-castleN .hl-title .l2.main{background-image:linear-gradient(100deg,transparent 38%,#fff 50%,transparent 62%),linear-gradient(180deg,#ffffff 25%,#fff7ed 58%,#fcd34d 100%)}
  #loader.th-castleN .hl-title .l2.glow{text-shadow:0 0 18px rgba(120,53,15,.85),0 0 46px rgba(251,146,60,.45)}
  #loader.th-castleN .hl-pct{color:#fde68a;text-shadow:0 0 10px #fde68a}
  #loader.th-castleN .hl-col svg .ln{stroke:#fde68a} #loader.th-castleN .hl-col.lit svg{filter:drop-shadow(0 0 6px #fde68a)}
  #loader.th-castleN .hl-panel{display:none}
  #loader.th-castleN .hl-group .cap::before{display:none} #loader.th-castleN .hl-group .g.main{background:none;-webkit-text-fill-color:#fff;color:#fff;animation:none}
  #loader.th-castleN .hl-group .cap{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6),0 0 40px rgba(252,211,77,.35)}
  #loader.th-castleN .hl-group .cap::after{inset:0;width:28%;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:capsweep 3.2s ease-in-out infinite}
  #loader.th-castleN .hl-group .g.glow{text-shadow:0 0 14px rgba(252,211,77,.9)}
  @keyframes capsweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(420%)}} @keyframes capflow{to{background-position:200% 0}}

  /* ===== ธีมคริสต์มาส ===== */
  #loader.th-xmas{background:linear-gradient(180deg,#090b2e 0%,#17154a 45%,#2c2266 80%,#3d2c74 100%)}
  #loader.th-xmas .hl-face{box-shadow:0 0 0 2px #fff,0 0 0 calc(var(--e)*.045) rgba(252,211,77,.28),0 0 34px rgba(252,211,77,.85),0 0 80px rgba(239,68,68,.45),0 0 140px rgba(252,211,77,.25)}
  #loader.th-xmas .hl-aurora{background:radial-gradient(ellipse 40% 50% at 28% 40%,rgba(252,211,77,.12),transparent 70%),radial-gradient(ellipse 35% 45% at 72% 30%,rgba(239,68,68,.12),transparent 70%)}
  #loader.th-xmas .hl-light{background:radial-gradient(circle,#fffdf2 0%,rgba(254,243,199,.7) 18%,rgba(252,211,77,.32) 34%,rgba(239,68,68,.12) 48%,transparent 66%)}
  #loader.th-xmas .hl-bloom{background:radial-gradient(circle,#fffdf5 0%,rgba(254,243,199,.94) 16%,rgba(252,211,77,.5) 30%,rgba(239,68,68,.16) 44%,transparent 62%)}
  .sc .xm-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 100%,rgba(252,211,77,.18),transparent 70%)}
  .sc .xm-bokeh i{position:absolute;border-radius:50%;filter:blur(2px)}
  .sc .xm-lightstr{position:absolute;left:0;top:0;width:100%;height:min(12vh,96px)}
  .sc .xm-bulb{position:absolute;width:9px;height:13px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);
    box-shadow:0 0 8px 2px var(--c),0 0 20px 4px var(--c);animation:bulb 2s ease-in-out infinite}
  @keyframes bulb{50%{opacity:.45;box-shadow:0 0 4px 1px var(--c)}}
  .sc .xm-tree{position:absolute;bottom:min(3vh,26px)}
  .sc .xm-tree .lt{animation:tw 1.8s ease-in-out infinite} .sc .xm-tree .l1{animation-delay:-.6s} .sc .xm-tree .l2{animation-delay:-1.2s}
  .sc .xm-tree .fl{animation:tw 1.2s ease-in-out infinite}
  @keyframes tw{50%{opacity:.35}}
  .sc .xm-tree circle.lt{filter:drop-shadow(0 0 3px #fde68a)}
  .sc .xm-tree.l{left:-6vw;width:min(46vw,300px)} .sc .xm-tree.r{right:-6vw;width:min(36vw,230px)}
  @media (min-width:821px){ .sc .xm-tree.l{left:3%;width:min(30vw,420px)} .sc .xm-tree.r{right:3%;width:min(22vw,300px)} }


  /* ต้นคริสต์มาสภาพจริง */
  .sc .xm-tree{aspect-ratio:446/1000;width:auto}
  .sc .xm-tree img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(252,211,77,.28)) drop-shadow(0 10px 18px rgba(0,0,0,.45))}

  function petal(x,y,s,r,c,a){ ax.save(); ax.translate(x,y); ax.rotate(r); ax.fillStyle=`rgba(${c},${a})`; ax.beginPath(); ax.ellipse(0,0,s,s*.55,0,0,6.283); ax.fill(); ax.restore(); }

  let alast=performance.now();
  function aloop(t){
    if(!ambRun) return; const dt=Math.min(50,t-alast); alast=t;
    ax.clearRect(0,0,AW,AH);

      const tw=.55+.45*Math.sin(t/500+p.ph);

        case 'petal': p.x+=p.vx+Math.sin(t/p.fq+p.ph)*p.amp; p.y+=p.vy+Math.cos(t/(p.fq*.7)+p.ph)*.25; p.r+=p.vr+Math.sin(t/400+p.ph)*.03; ax.save(); ax.translate(p.x,p.y); ax.scale(1,.35+.65*Math.abs(Math.sin(t/350+p.ph))); petal(0,0,p.s,p.r,p.c,.8); ax.restore(); if(p.y>AH+20||p.x>AW+20){Object.assign(p,mkA(false)); p.x=R()*AW*1.2-AW*.3;} break;
        case 'leaf':  p.x+=p.vx+Math.sin(t/800+p.ph)*.8; p.y+=p.vy; p.r+=p.vr; leaf(p.x,p.y,p.s,p.r,p.c); if(p.y>AH+20||p.x>AW+20){Object.assign(p,mkA(false)); p.x=R()*AW*1.2-AW*.3;} break;
        case 'glyph': p.y-=p.vy; ax.font=`${p.s}px serif`; ax.fillStyle=`rgba(${p.c},${p.a*tw})`; ax.fillText(p.ch,p.x,p.y); if(p.y<-20) Object.assign(p,mkA(false)); break;
        case 'bit':   p.y+=p.vy; ax.font=`600 ${p.s}px Rajdhani, monospace`; ax.fillStyle=`rgba(${p.c},${p.a})`; ax.fillText(p.ch,p.x,p.y); if(p.y>AH+20) Object.assign(p,mkA(false)); break;
        case 'spore': p.y-=p.vy; p.x+=Math.sin(t/1300+p.ph)*.35; glow(p.x,p.y,p.s,p.c,.8*tw); if(p.y<-12) Object.assign(p,mkA(false)); break;
        case 'dust':  p.y-=p.vy; p.x+=Math.sin(t/1500+p.ph)*.25; glow(p.x,p.y,p.s,p.c,.7*tw); if(p.y<-12) Object.assign(p,mkA(false)); break;
        case 'snow': p.y+=p.vy; p.x+=Math.sin(t/1300+p.ph)*p.sw*.5+.15; ax.fillStyle=`rgba(255,255,255,${p.a})`; ax.beginPath(); ax.arc(p.x,p.y,p.s,0,6.283); ax.fill(); if(p.z>.75){ax.fillStyle=`rgba(255,255,255,${p.a*.18})`; ax.beginPath(); ax.arc(p.x,p.y,p.s*2.6,0,6.283); ax.fill();} if(p.y>AH+12){Object.assign(p,mkA(false)); p.x=R()*AW;} break;

      }
    }
    if(KIND==='firework'){
      nextFw-=dt; if(nextFw<=0){ nextFw=900+R()*900; const x=AW*(.12+R()*.76), y=AH*(.08+R()*.3), c=pick(['253,230,138','249,168,212','196,181,253','255,255,255']);
        for(let i=0;i<46;i++){ const a=i/46*6.283, v=1.6+R()*2.2; sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c}); } }

    }

      if(shoot){ shoot.x+=9; shoot.y+=4; shoot.l-=.02; const g=ax.createLinearGradient(shoot.x-120,shoot.y-54,shoot.x,shoot.y);
        g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${shoot.l})`); ax.strokeStyle=g; ax.lineWidth=2;
        ax.beginPath(); ax.moveTo(shoot.x-120,shoot.y-54); ax.lineTo(shoot.x,shoot.y); ax.stroke(); if(shoot.l<=0) shoot=null; }

  /* ---------- ตัวช่วย ---------- */

  /* ชื่อโรงเรียนบรรทัดเดียว: ย่อให้พอดีความกว้างจอ */
  function fitTitle(){ const w=$('.hl-title .wrap'), main=$('.hl-title .l2.main'), glow=$('.hl-title .l2.glow');
    [main,glow].forEach(e=>e.style.fontSize=''); const max=window.innerWidth*.92, cur=w.scrollWidth;

  fitTitle(); addEventListener('resize',fitTitle); if(document.fonts) document.fonts.ready.then(fitTitle);

  /* ย่อทั้งชุดให้พอดีจอที่เตี้ย (เช่น มือถือแนวนอน) */
  function fitCenter(){ const c=$('.hl-center'); c.style.transform=''; const kids=[...c.children];
    const top=Math.min(...kids.map(k=>k.getBoundingClientRect().top)), bot=Math.max(...kids.map(k=>k.getBoundingClientRect().bottom));
    const stg=$('.hl-stage').getBoundingClientRect(), ring=stg.height*1.15;           // เผื่อวงเวทรอบตรา
    const need=(bot-Math.min(top,stg.top+stg.height/2-ring))+24, avail=window.innerHeight;
    /* ขยาย/ย่อทั้งชุดตามสัดส่วนจอ: เต็มความสูงประมาณ 88% และไม่เกินความกว้าง 94% */
    const wide=Math.max(...kids.map(k=>k.getBoundingClientRect().width));

  fitCenter(); addEventListener('resize',fitCenter); if(document.fonts) document.fonts.ready.then(fitCenter);

  /* ===== ธีมหมู่บ้านริมทะเลสาบ : ตกแต่งตรา 5 แบบ ===== */
  const CS=(function(){
    const st=$('.hl-stage'), coin=$('.hl-coin'), ctr=$('.hl-center');
    { const v=document.createElement('div'); v.className='al-veil'; $('.xm-room').after(v); }
    const front=document.createElement('div'); front.className='cs-front'; coin.after(front);
    gsap.set(front,{xPercent:-50,yPercent:-50,opacity:1});
    const R=(a,b)=>a+Math.random()*(b-a);
    const lay=document.createElement('div'); lay.className='cs-sky'; lay.style.zIndex=4; ctr.after(lay);
    const C=()=>{ const r=coin.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2,r:r.width/2}; };
    const coinIn=(tl,at,from)=>tl.fromTo(coin,Object.assign({opacity:0,scale:.6},from||{}),{opacity:1,scale:1,x:0,y:0,filter:'blur(0px)',duration:1.2,ease:'expo.out',clearProps:'filter'},at);

    /* เครื่องทำฝุ่นประกาย (canvas) */
    function dust(){
      const cv=document.createElement('canvas'); cv.className='cs-dust'; ctr.after(cv);
      const g=cv.getContext('2d'); let W,H;
      const fit=()=>{ const D=Math.min(devicePixelRatio||1,1.5); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*D; cv.height=H*D; g.setTransform(D,0,0,D,0,0); };
      fit(); addEventListener('resize',fit);
      const spr=c=>{ const k=document.createElement('canvas'); k.width=k.height=48; const x=k.getContext('2d');
        const r=x.createRadialGradient(24,24,0,24,24,24); r.addColorStop(0,'#fff'); r.addColorStop(.2,c); r.addColorStop(.55,'rgba(100,116,139,.28)'); r.addColorStop(1,'rgba(100,116,139,0)');
        x.fillStyle=r; x.fillRect(0,0,48,48); x.fillStyle='#fff'; x.beginPath(); x.moveTo(24,1); x.lineTo(26.5,21.5); x.lineTo(47,24); x.lineTo(26.5,26.5); x.lineTo(24,47); x.lineTo(21.5,26.5); x.lineTo(1,24); x.lineTo(21.5,21.5); x.closePath(); x.fill(); return k; };
      const SP=[spr('rgba(255,255,255,.95)'),spr('rgba(226,232,240,.95)'),spr('rgba(203,213,225,.9)'),spr('rgba(241,245,249,.95)')];
      const SPK=(()=>{ const k=document.createElement('canvas'); k.width=k.height=12; const x=k.getContext('2d'); const r=x.createRadialGradient(6,6,0,6,6,6);
        r.addColorStop(0,'#fff'); r.addColorStop(.35,'rgba(255,255,255,.95)'); r.addColorStop(.6,'rgba(120,130,150,.35)'); r.addColorStop(1,'rgba(120,130,150,0)'); x.fillStyle=r; x.fillRect(0,0,12,12); return k; })();
      const P=[]; const o={head:null,idle:false,linger:1};
      o.add=(x,y,k,slow)=>{ if(P.length>2600) return; for(let i=0;i<k;i++){ const big=Math.random()<.07; P.push({x:x+R(-3,3),y:y+R(-3,3),vx:R(-.06,.06),vy:R(-.03,.08),s:big?R(3.5,6.5):R(.9,2.2),big,l:1,d:(slow?R(.0011,.0024):R(.008,.016)),ph:R(0,6.28),c:SP[(Math.random()*4)|0]}); } };
      (function loop(t){ if(!cv.isConnected) return; g.clearRect(0,0,W,H);

        if(o.idle&&Math.random()<.9){ const c=C(); const a=R(Math.PI,Math.PI*2); const aa=Math.PI*R(.86,2.14); o.add(c.x+Math.cos(aa)*c.r*1.95,c.y+c.r*.45+Math.sin(aa)*c.r*2.25,2,true); }
        for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.004; p.l-=p.d; if(p.l<=0){P.splice(i,1);continue;}
          g.globalAlpha=Math.min(1,p.l*1.6)*(p.big?(.4+.6*Math.abs(Math.sin(t/160+p.ph))):(.6+.4*Math.sin(t/90+p.ph))); const z=p.s*(.7+.3*p.l)*(p.big?1:2.2); g.drawImage(p.big?p.c:SPK,p.x-z,p.y-z,z*2,z*2); }
        g.globalAlpha=1; requestAnimationFrame(loop); })(performance.now());
      return o;
    }
    const V={};

    /* 1) ประกายโค้ง — ดาวลากหางประกายโค้งข้ามเหนือตรา ประกายค้างเป็นแนวโค้งแล้วค่อยๆ ร่วงระยิบ */
    V.h1=()=>{
      /* ซุ้มประกาย: ดาวนำวาดเส้นแสงบางๆ เป็นโค้งเหนือตรา ละอองเล็กละเอียดระยิบตามเส้น ฝุ่นร่วงช้าๆ ใต้เส้น */
      const cv=document.createElement('canvas'); cv.className='cs-dust'; ctr.after(cv);
      const g=cv.getContext('2d'); let W,H,D;

      const geo=()=>{ const c=C(), R0=Math.min(c.r*1.42,innerWidth/2-16); return {cx:c.x, cy:c.y+c.r*.05, rx:R0, ry:R0, r:c.r}; };
      const at=(G,t)=>{ const a=A0+(A1-A0)*t; return [G.cx+Math.cos(a)*G.rx, G.cy+Math.sin(a)*G.ry]; };
      const N=reduce?260:800, specks=[];

      const fall=[], pop=[]; const st={p:0, idle:false, glow:0};
      const burstAt=(x,y)=>{ const n=reduce?60:220; for(let i=0;i<n;i++){ const a=R(0,6.283), v=R(6,16)*R(.5,1); pop.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(.8,1.8),gr:R(1.06,1.1),l:1,d:R(.035,.055),ph:R(0,6)}); } };
      const star=(x,y,s,a)=>{ g.globalAlpha=a; g.strokeStyle='#fff'; g.lineWidth=Math.max(.6,s*.18);
        g.beginPath(); g.moveTo(x-s,y); g.lineTo(x+s,y); g.moveTo(x,y-s); g.lineTo(x,y+s); g.stroke();
        g.lineWidth=Math.max(.4,s*.1); const k=s*.45; g.beginPath(); g.moveTo(x-k,y-k); g.lineTo(x+k,y+k); g.moveTo(x-k,y+k); g.lineTo(x+k,y-k); g.stroke();
        g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,s*.22,0,6.283); g.fill(); };
      (function loop(t){ if(!cv.isConnected) return; const T=t/1000; g.clearRect(0,0,W,H); const G=geo();
        /* เส้นแสงบางๆ */
        if(st.p>0){ g.save(); g.lineCap='round'; g.shadowColor='rgba(255,255,255,.95)'; g.shadowBlur=10; g.strokeStyle=`rgba(255,255,255,${.55*st.glow})`; g.lineWidth=.9;
          g.beginPath(); for(let i=0;i<=80;i++){ const q=at(G,st.p*i/80); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); } g.stroke(); g.restore(); }
        /* ละอองตามเส้น */
        for(const p of specks){ if(p.t>st.p) continue; const age=Math.min(1,(st.p-p.t)*8);
          const a=A0+(A1-A0)*p.t, nx=Math.cos(a), ny=Math.sin(a), q=at(G,p.t), x=q[0]+nx*p.o, y=q[1]+ny*p.o;
          const tw=.35+.65*Math.abs(Math.sin(T*p.sp+p.ph));
          if(p.big){ g.globalAlpha=age*tw*.9; const rr=p.s*3.2, rg=g.createRadialGradient(x,y,0,x,y,rr); rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.35,'rgba(255,255,255,.5)'); rg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=rg; g.beginPath(); g.arc(x,y,rr,0,6.283); g.fill(); }
          else { g.globalAlpha=age*tw; g.fillStyle='#fff'; g.shadowColor='rgba(255,255,255,.9)'; g.shadowBlur=3; g.beginPath(); g.arc(x,y,p.s,0,6.283); g.fill(); g.shadowBlur=0; } }
        /* ฝุ่นร่วง */
        if((st.p>0&&st.p<1)||st.idle){ const k=st.idle?(Math.random()<.8?2:1):5; for(let i=0;i<k;i++){ const tt=st.idle?Math.random():st.p-R(0,.04); const q=at(G,Math.max(0,tt)); fall.push({x:q[0]+R(-5,5),y:q[1]+R(-3,3),vy:R(.1,.35),vx:R(-.12,.12),l:1,s:R(.35,1),ph:R(0,6)}); } }

          g.globalAlpha=f.l*(.5+.5*Math.sin(T*8+f.ph)); g.fillStyle='#fff'; g.beginPath(); g.arc(f.x,f.y,f.s,0,6.283); g.fill(); }

          const a=f.l*(.6+.4*Math.sin(T*9+f.ph)); g.globalAlpha=a; const rr=f.s*2.4, rg=g.createRadialGradient(f.x,f.y,0,f.x,f.y,rr); rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.35,'rgba(255,255,255,.8)'); rg.addColorStop(.6,'rgba(100,116,139,.25)'); rg.addColorStop(1,'rgba(100,116,139,0)'); g.fillStyle=rg; g.beginPath(); g.arc(f.x,f.y,rr,0,6.283); g.fill(); }

          g.fillStyle=rg; g.beginPath(); g.arc(q[0],q[1],22,0,6.283); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(q[0],q[1],3,0,6.283); g.fill(); }

      return [tl,2.7,()=>{ gsap.to(st,{glow:.55,duration:2.2,yoyo:true,repeat:-1,ease:'sine.inOut'}); }];
    };

    /* 2) ระลอกน้ำ — ตราร่วงลงแตะผิวน้ำ เกิดระลอกคลื่นกระเพื่อมเป็นวงขยายออก + ละอองน้ำกระเซ็น */
    V.h2=()=>{
      const ring=()=>{ const c=C(), e=document.createElement('i'); e.className='hs-rip'; lay.appendChild(e);
        gsap.fromTo(e,{x:c.x,y:c.y,width:c.r*2,height:c.r*2,opacity:.95},{width:c.r*6,height:c.r*6,opacity:0,duration:2.6,ease:'power2.out',onComplete:()=>e.remove()}); };

        .to(coin,{scaleX:1.08,scaleY:.9,duration:.12,yoyo:true,repeat:1,ease:'power1.out'},1.3)
        .call(()=>{ ring(); setTimeout(ring,260); setTimeout(ring,560); const c=C(); d.add(c.x,c.y-c.r*.3,reduce?16:46); },null,1.3);
      return [tl,2.2,()=>{ (function again(){ if(!lay.isConnected) return; ring(); gsap.delayedCall(2.4,again); })(); gsap.to(coin,{y:-5,duration:2.4,yoyo:true,repeat:-1,ease:'sine.inOut'}); }];
    };

    /* 3) สายหมอก — หมอกขาวปกคลุมกลางจอ แล้วค่อยๆ แหวกออกซ้ายขวา เผยตรา หมอกบางๆ ลอยผ่านตลอด */
    V.h3=()=>{
      const mist=[], n=reduce?6:10;
      for(let i=0;i<n;i++){ const e=document.createElement('i'); e.className='hs-mist'; lay.appendChild(e); mist.push(e); }
      const tl=gsap.timeline(), c=C();
      mist.forEach((e,i)=>{ const w=innerWidth*R(.7,1.2), h=c.r*R(1.4,2.4), left=i%2===0;
        const cx=innerWidth/2; gsap.set(e,{width:w,height:h,x:cx-w/2+R(-50,50),y:c.y-h/2+R(-c.r*1.4,c.r*1.6),opacity:0});

          .to(e,{x:(left?-1:1)*innerWidth*R(.55,.8)+innerWidth/2-w/2,opacity:R(.25,.4),duration:R(2.2,3),ease:'power2.inOut'},.9+R(0,.4)); });
      coinIn(tl,1.3,{scale:.92,filter:'blur(8px)'});
      return [tl,2.6,()=>{ mist.forEach((e,i)=>gsap.to(e,{x:'+='+(i%2?-1:1)*R(60,140),duration:R(6,9),yoyo:true,repeat:-1,ease:'sine.inOut'})); }];
    };

    /* 4) ดอกไม้ระเบียง — ดอกเจอเรเนียมสีชมพูบานทีละดอกเรียงเป็นพวงรอบตรา แล้วไหวเบาๆ */
    V.h4=()=>{
      const n=reduce?10:16, F=[], COL=[['#f472b6','#be185d'],['#fb7185','#be123c'],['#f9a8d4','#db2777'],['#ffffff','#f472b6']];
      for(let i=0;i<n;i++){ const [a,b]=COL[i%COL.length]; const e=document.createElement('div'); e.className='hs-fl';
        e.innerHTML=`<svg viewBox="-20 -20 40 40"><path d="M-14 6 C-20 -4 -10 -10 -4 -2Z M14 6 C20 -4 10 -10 4 -2Z" fill="#16a34a" opacity=".85"/>
          ${[0,72,144,216,288].map(r=>`<ellipse cx="0" cy="-7" rx="5.4" ry="7" fill="${a}" stroke="${b}" stroke-width=".8" transform="rotate(${r})"/>`).join('')}
          <circle r="3.2" fill="#fde047"/><circle r="1.3" fill="#ca8a04"/></svg>`; lay.appendChild(e); F.push(e); }
      const tl=gsap.timeline();
      F.forEach((e,i)=>{ const c=C(), a=-Math.PI/2+i/n*6.283, r=c.r*1.2; e._p=[c.x+Math.cos(a)*r,c.y+Math.sin(a)*r];
        gsap.set(e,{x:e._p[0],y:e._p[1],scale:0,rotation:R(-40,40)});
        tl.to(e,{scale:R(.85,1.15),rotation:0,duration:.6,ease:'back.out(2.6)'},.2+i*.09); });
      coinIn(tl,.9,{scale:.5});
      return [tl,2.3,()=>{ F.forEach(e=>gsap.to(e,{rotation:()=>R(-12,12),scale:()=>R(.85,1.15),duration:()=>R(1.6,2.6),yoyo:true,repeat:-1,repeatRefresh:true,ease:'sine.inOut'})); }];
    };

    /* 5) ฝูงนก — ฝูงนกบินเข้ามาเป็นรูปตัววี วนรอบตราหนึ่งรอบ แล้วบินขึ้นฟ้าไป */
    V.h5=()=>{
      const n=reduce?5:9, B=[];
      for(let i=0;i<n;i++){ const e=document.createElement('div'); e.className='hs-bird'; e.innerHTML='<svg viewBox="0 0 28 14"><path class="wg" d="M1 3 Q7 -1 14 8 Q21 -1 27 3" fill="none" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        e.style.animationDelay=(-i*.07)+'s'; lay.appendChild(e); B.push(e); }
      const tl=gsap.timeline(), pr={v:0};
      const off=B.map((_,i)=>{ const k=Math.ceil(i/2), s=i%2?1:-1; return [-k*22, s*k*16]; });
      const place=()=>{ const c=C(), rad=c.r*1.7; let px,py,ang;
        const v=pr.v;
        if(v<.3){ const u=v/.3; px=-80+(c.x-rad+80)*u; py=c.y-c.r*2.2+(c.r*2.2)*u*u; ang=0; }
        else if(v<.8){ const u=(v-.3)/.5, a=Math.PI+u*Math.PI*2; px=c.x+Math.cos(a)*rad; py=c.y+Math.sin(a)*rad*.8; ang=a+Math.PI/2; }
        else { const u=(v-.8)/.2; px=c.x-rad+u*(innerWidth+120-(c.x-rad)); py=c.y-u*innerHeight*.6; ang=-.5; }
        const ca=Math.cos(ang), sa=Math.sin(ang);
        B.forEach((e,i)=>{ const [dx,dy]=off[i]; gsap.set(e,{x:px+dx*ca-dy*sa,y:py+dx*sa+dy*ca,rotation:ang*57.3}); }); };
      tl.to(pr,{v:1,duration:3.2,ease:'none',onUpdate:place,onStart:place},0)
        .set(B,{opacity:0},3.2);
      coinIn(tl,1.6,{scale:.7});
      return [tl,2.4,()=>{ (function fly(){ if(!lay.isConnected) return; const k=2+((Math.random()*3)|0), y0=R(.05,.3)*innerHeight;
          for(let j=0;j<k;j++){ const e=document.createElement('div'); e.className='hs-bird'; e.style.opacity=.75; e.innerHTML=B[0].innerHTML; lay.appendChild(e);
            gsap.fromTo(e,{x:-40-j*26,y:y0+j*(j%2?12:-10),scale:.75},{x:innerWidth+60,y:'-='+R(20,90),duration:R(7,10),ease:'none',onComplete:()=>e.remove()}); }
          gsap.delayedCall(R(3,6),fly); })(); }];
    };

    const run=V[XV]||V.h1;
    return { intro(){ const [tl,len,idle]=run(); this.len=len; this.idle=idle; return tl; }, len:2.5, idle(){} };
  })();

  /* ================= ลำดับ ================= */
  let introDone=false, ready=false, exiting=false;
  gsap.set(['.hl-eyebrow','.hl-title .wrap','.hl-group','.hl-load','.hl-door'],{opacity:0}); loader.classList.add('go');
  const tl=gsap.timeline();
  /* 1) บินผ่านละอองแสง */
  tl.from('.hl-aurora',{opacity:0,duration:2},0)
    .to(fly,{speed:.2,duration:2,ease:'power3.out'},1.1)
    .addLabel('holo',.4)
    .call(()=>setStatus('กำลังเปิดประตูสู่คลังงบประมาณ…'),null,'holo+=.2')
    .add(CS.intro(),'holo')
    .addLabel('open','holo+='+(CS.len-1.1))
    .call(()=>{ CS.idle(); burst(0); },null,'holo+='+CS.len)
    .fromTo('.hl-light',{opacity:0,scale:.5},{opacity:.6,scale:1,duration:1.4,ease:'power2.out'},'open+=.4')
  /* 5) ข้อความ */
    .fromTo('.hl-eyebrow',{opacity:0,letterSpacing:'1em'},{opacity:1,letterSpacing:'.45em',duration:1.2,ease:'expo.out'},'open+=.55')
    .fromTo('.hl-title .wrap',{opacity:0,y:24,scale:.95},{opacity:1,y:0,scale:1,duration:1.3,ease:'expo.out',
       onComplete:()=>$('.hl-title .l2.main').classList.add('sheen')},'open+=.75')
    .fromTo('.hl-group',{opacity:0,scale:.6,filter:'blur(10px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.9,ease:'expo.out',clearProps:'filter'},'open+=1')
    .fromTo('.hl-group .g',{y:14,opacity:0},{y:0,opacity:1,duration:.8,ease:'expo.out'},'open+=1.15')
    .fromTo('.hl-group .g.glow',{opacity:0},{keyframes:{opacity:[0,1,.7]},duration:1.2},'open+=1.3')
    .fromTo('.hl-load',{opacity:0,y:14},{opacity:1,y:0,duration:.9,ease:'expo.out'},'open+=1.1');
  gsap.to('.hl-ring.r1',{rotation:360,duration:40,repeat:-1,ease:'none'});
  gsap.to('.hl-ring.r2',{rotation:-360,duration:18,repeat:-1,ease:'none'});
  gsap.to('.hl-sigil .s1',{rotation:360,duration:36,repeat:-1,ease:'none'});
  gsap.to('.hl-sigil .s2',{rotation:-360,duration:24,repeat:-1,ease:'none'});
  { const m=$('.hl-mote'); for(let i=0;i<6;i++){ const d=document.createElement('i'); const a=i/6*Math.PI*2;
      d.style.left=(50+Math.cos(a)*50)+'%'; d.style.top=(50+Math.sin(a)*50)+'%'; d.style.margin='-2.5px 0 0 -2.5px'; if(i%2) d.style.background='#e9d5ff'; m.appendChild(d); }
    gsap.to(m,{rotation:360,duration:9,repeat:-1,ease:'none'});
    gsap.to('.hl-mote i',{scale:.4,opacity:.4,duration:.9,yoyo:true,repeat:-1,stagger:.15,ease:'sine.inOut'}); }
  gsap.to('.hl-face',{scale:1.025,duration:2,yoyo:true,repeat:-1,ease:'sine.inOut'});
  gsap.to('.hl-panel .blink',{opacity:.2,duration:.6,yoyo:true,repeat:-1,ease:'steps(1)'});

  /* 6) โหลดทีละงาน */
  const STEPS=['กำลังโหลดแผนงานและโครงการ','กำลังตรวจสอบยอดเงินคงเหลือ','กำลังจัดเตรียมทะเบียนบัญชี','กำลังซิงก์ข้อมูลพัสดุ'];
  STEPS.forEach((txt,i)=>{
    tl.to(prog,{v:(i+1)*.225,duration:.6,ease:'power2.inOut',onUpdate:render,onStart:()=>{
        setStatus(txt);
        gsap.to(panelBars[i],{scaleX:1,duration:.6,ease:'power2.out'}); },
      onComplete:()=>cols[i].classList.add('lit')}, i===0?'open+=1.35':'>');
  });
  tl.call(()=>{ introDone=true; if(!ready) setStatus('กำลังรอข้อมูลจากเซิร์ฟเวอร์…'); tryExit(); });

  /* ================= ฉากจบ: โฮโลแกรมดับ → เร่งบินพุ่งเข้าเหรียญ → แสงเปิดหน้า ================= */
  function placeBloom(){ const b=$('.hl-bloom'); b.style.top=(VP.y-b.offsetWidth/2)+'px'; }
  function tryExit(){
    if(!introDone||!ready||exiting) return; exiting=true;
    vp(); placeBloom();
    gsap.timeline({onComplete:()=>{ running=false; ambRun=false; loader.remove(); document.body.style.overflow=''; }})
      .call(()=>setStatus('คลังงบประมาณพร้อมใช้งาน'))
      .to(prog,{v:1,duration:.5,ease:'power2.out',onUpdate:render})
      .to('.hl-panel',{keyframes:{opacity:[1,.2,.8,0]},scaleY:.02,duration:.5,ease:'power2.in'},'+=.25')
      .to(['.hl-eyebrow','.hl-title','.hl-group','.hl-load'],{opacity:0,y:-14,duration:.6,stagger:.05,ease:'power2.in'},'<')
      .to('.hl-ring',{scale:1.6,opacity:0,duration:.9,ease:'power2.in'},'<')
      .to(fly,{speed:5,duration:1.3,ease:'power2.in'},'<')
      .to('.hl-coin',{scale:1.5,duration:1.2,ease:'power2.in'},'<')
      .to('.hl-sigil',{scale:2.4,opacity:0,rotation:'+=200',duration:1.2,ease:'power2.in'},'<')
      .to(['.xm-frame','.cs-front','.cs-sky'],{scale:1.9,opacity:0,duration:1.2,ease:'power2.in'},'<').to('.cs-dust',{opacity:0,duration:.9},'<')
      .to('.hl-mote',{scale:2,opacity:0,duration:1,ease:'power2.in'},'<')
      .to('.hl-light',{opacity:1,scale:1.9,duration:1.1,ease:'power2.in'},'<.1')
      .call(()=>burst(reduce?30:120,1.3),null,'>-.2')
      .fromTo('.hl-bloom',{opacity:0,scale:.15},{opacity:1,scale:1.3,duration:.9,ease:'power2.in'},'<')
      .set(['.hl-center','#space','.hl-aurora','.hl-scan','.hl-panel','.sc','#amb','.xm-room','.al-veil','.al-ray','.al-flare','.cs-sky','.cs-dust','.cs-front'],{autoAlpha:0})
      .set(loader,{background:'transparent'})
      .to('.hl-bloom',{opacity:0,scale:1.8,duration:1.1,ease:'power2.out'})
      .to('#fx',{opacity:0,duration:.9},'<.3')
      .from('#app > *, .app-body > *',{scale:1.04,opacity:0,y:16,duration:1,stagger:.06,ease:'expo.out'},'<-.3');
  }

  /* ---------- API: ให้ระบบเรียกเมื่อโหลดข้อมูลเสร็จ ---------- */
  window.SchoolLoader = { ready(){ ready=true; tryExit(); } };

  /* หน้าโหลดนี้ใช้ก่อนหน้าเข้าสู่ระบบ: เปิดหน้าล็อกอินเมื่อหน้าเว็บโหลดเสร็จ
     (แอนิเมชันจะเล่นครบก่อนเสมอ ประมาณ 6–7 วินาที แล้วค่อยเปิดหน้าล็อกอิน)
     ถ้าต้องการรอดึงข้อมูลจากเซิร์ฟเวอร์ก่อน ให้ลบ 2 บรรทัดล่าง แล้วเรียก SchoolLoader.ready() ใน withSuccessHandler แทน */
  if (document.readyState === 'complete') SchoolLoader.ready();
  else window.addEventListener('load', () => SchoolLoader.ready());
})();
</script>

<script>
/* ตัวห่อ (ไม่แตะเนื้อหาธีมเดิม): แจ้งหน้าหลักเมื่อหน้าโหลดจบ */
(function(){var fixed=0;
/* ฉากจบของธีม: ธีมสั่ง #loader เป็นโปร่งใสให้เห็นหน้าเว็บ แต่ไฟล์ธีมมีกฎพื้นน้ำตาลเข้ม !important ทับไว้ ทำให้จอมืดค้าง ~1 วินาทีก่อนเข้าหน้า · ตัวห่อแก้เฉพาะช่วงจบนี้: ปล่อยพื้นโปร่งใสและซ่อนของตกแต่งที่เหลือ (เหลือแค่แสงเปิดหน้ากับเหรียญที่กำลังจาง) ช่วงเล่นปกติไม่แตะ */
function endFix(){var l=document.getElementById('loader');if(!l||fixed)return;var b=(l.style.backgroundColor||l.style.background||'').replace(/\s/g,'');
if(b==='transparent'||b==='rgba(0,0,0,0)'){fixed=1;var st=document.createElement('style');st.textContent='#loader#loader#loader{background:transparent!important}#loader#loader>*:not(.hl-bloom):not(#fx){visibility:hidden!important}#fx{opacity:0!important;transition:opacity .3s!important}body{opacity:0!important;transition:opacity .45s ease .12s!important}';document.head.appendChild(st)}}
var t=setInterval(function(){endFix();if(!document.getElementById('loader')){clearInterval(t);try{parent.postMessage('sbl-done','*')}catch(e){}}},50);})();
</script></body></html>
